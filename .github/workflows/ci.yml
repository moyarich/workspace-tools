name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  check-dist:
    name: Check committed CLI distribution
    uses: moyarich/reusable-workflows/.github/workflows/reusable_check-dist.yml@main
    with:
      dist-path: packages/workspace-tools/dist/bin/
      build-command: npm run build
      node-version: "24"

  test:
    name: Test package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=optional
      - name: Validate publishable package changelog
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("packages/workspace-tools/package.json", "utf8"));
          const changelog = readFileSync("packages/workspace-tools/CHANGELOG.md", "utf8");
          const version = manifest.version.replace(/[.*+?^${}()|[\]\\]/g, "\\      - run: npm ci --ignore-scripts");
          if (!new RegExp(`^## \\[(?:${version})\\]`, "m").test(changelog)) {
            throw new Error(`Missing ${manifest.version} changelog entry`);
          }
          NODE
      - run: npm test
      - run: npm run pack:check
