name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  lint-workflows:
    name: Validate GitHub Actions workflow syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint workflow expressions and reusable calls
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color -shellcheck=

  check-dist:
    name: Check committed CLI distribution
    uses: moyarich/reusable-workflows/.github/workflows/reusable_check-dist.yml@main
    with:
      dist-path: packages/workspace-tools/dist/bin/
      build-command: npm run build
      node-version: "24"

  test:
    name: Test package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=optional
      - name: Validate publishable package changelog
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("packages/workspace-tools/package.json", "utf8"));
          const changelog = readFileSync("packages/workspace-tools/CHANGELOG.md", "utf8");
          const headings = changelog.split(/\r?\n/).map(line => line.trim());
          if (!headings.includes(`## [${manifest.version}]`) && !headings.includes(`## ${manifest.version}`)) {
            throw new Error(`Missing ${manifest.version} changelog entry`);
          }
          NODE
      - run: npm test
      - run: npm run pack:check
