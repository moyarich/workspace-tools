name: Check distribution

run-name: >-
  Check dist · ${{ inputs.package }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: all, package directory, or package name
        type: string
        required: true
        default: all
      dist-path:
        description: "Distribution path template. Supports {packageDir}, {package}, {packageName}, {workspace}; blank uses repository configuration or {packageDir}/dist."
        type: string
        default: ""
      build-command:
        description: Build command override (for example npm run build:cli); 
          empty uses the selected workspace build
        type: string
        default: ""
      install-command:
        description: Dependency install command
        type: string
        default: npm ci --ignore-scripts
      dry-run:
        description: Upload rebuilt artifacts, without committing or pushing
        type: boolean
        default: true
      commit:
        description: Commit updated output only when dry-run is false (single package only)
        type: boolean
        default: false
      node-caching:
        description: Node cache mode (npm or empty to disable)
        type: string
        default: npm
      include-root-package:
        description: Include buildable root package in discovery
        type: boolean
        default: true
      workspace-tools-source:
        description: Workspace Tools CLI source for discovery
        type: choice
        required: true
        default: auto
        options:
          - auto
          - checkout:current
          - checkout:upstream;branch:main
          - registry:npm:latest

permissions: {}

jobs:
  discover-packages:
    name: Discover workspace packages
    permissions:
      contents: read
    uses: 
      moyarich/reusable-workflows/.github/workflows/reusable_discover-packages.yml@main
    with:
      packages-directory: packages
      use-workspaces: true
      require-build-script: true
      include-private: true
      include-root-package: ${{ inputs.include-root-package }}
      workspace-tools-source: ${{ inputs.workspace-tools-source }}

  select-packages:
    name: Select distributions
    needs: discover-packages
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has-packages: ${{ steps.select.outputs.has-packages }}
      single-package: ${{ steps.select.outputs.single-package }}
    steps:
      - name: Checkout configuration
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Filter discovered packages
        id: select
        shell: bash
        env:
          DISCOVERED: ${{ needs.discover-packages.outputs.packages }}
          PACKAGES: ${{ inputs.package }}
          DIST_PATH_OVERRIDE: ${{ inputs.dist-path }}
          BUILD_COMMAND_OVERRIDE: ${{ inputs.build-command }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(process.env.DISCOVERED);
          const selected = process.env.PACKAGES.trim();
          const eligible = report.included;
          const { execFileSync } = require('node:child_process');
          const configFile = '.github/check-dist-config.yml';
          const config = fs.existsSync(configFile)
            ? JSON.parse(execFileSync('ruby', ['-r', 'yaml', '-r', 'json', '-e',
                'print JSON.generate(YAML.safe_load(File.read(ARGV.fetch(0)), aliases: false) || {})', configFile], { encoding: 'utf8' }))
            : {};
          const overrides = config.packages || {};
          const available = [...eligible, ...(config.extraPackages || [])];
          const packages = selected === 'all'
            ? available
            : available.filter(p => p.directory === selected || p.name === selected);
          if (packages.length === 0) {
            console.error('::error title=No matching package::Select a discovered package directory/name or all.');
            process.exit(1);
          }
          const matrix = JSON.stringify({include: packages.map(p => {
            const settings = overrides[p.directory] || overrides[p.name] || {};
            const dir = p.directory === '.' ? 'root' : p.directory;
            return {
              ...p,
              artifactSuffix: dir.replace(/^(packages|apps)\//, '').replace(/[^a-zA-Z0-9._-]+/g, '-'),
              distTemplate: process.env.DIST_PATH_OVERRIDE || settings.distPath || '{packageDir}/dist',
              buildCommand: process.env.BUILD_COMMAND_OVERRIDE || settings.buildCommand || (p.directory === '.' ? 'npm run build' : 'npm run build --workspace ' + p.name),
            };
          })});
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'matrix=' + matrix + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'has-packages=true\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'single-package=' + (packages.length === 1) + '\n');
          console.log('Selected ' + packages.map(p => p.directory).join(', '));
          NODE

  check-dist:
    name: "dist: ${{ matrix.name }}"
    needs: select-packages
    if: ${{ needs.select-packages.outputs.has-packages == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-packages.outputs.matrix) }}
    permissions:
      contents: write
    uses: 
      moyarich/reusable-workflows/.github/workflows/reusable_self-heal-dist.yml@main
    with:
      dist-path: ${{ matrix.distTemplate }}
      build-command: ${{ matrix.buildCommand }}
      install-command: ${{ inputs.install-command }}
      node-caching: ${{ inputs.node-caching }}
      package-name: ${{ matrix.name }}
      package-directory: ${{ matrix.directory }}
      artifact-name: ${{ format('dist-{0}', matrix.artifactSuffix) }}
      node-version: "24"
      repair: true
      commit: ${{ inputs.commit && !inputs.dry-run && needs.select-packages.outputs.single-package == 'true' }}
      target-branch: ${{ github.ref_name }}
      expected-sha: ${{ github.sha }}
      checkout-sha: ${{ github.sha }}
