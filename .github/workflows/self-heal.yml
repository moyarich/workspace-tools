name: Self-heal

on:
  push:
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  packages: read

concurrency:
  group: self-heal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prettier:
    needs: package-lock
    uses: moyarich/reusable-workflows/.github/workflows/reusable_prettier.yml@main
    with:
      mode: fix
      prettier-config: this-repository
      commit: true
      node-version: "24"

  package-lock:
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-package-lock.yml@main
    with:
      commit: true
      node-version: "24"
    secrets:
      package-token: ${{ secrets._GITHUB_TOKEN }}

  cli-dist:
    name: Heal generated CLI distribution
    needs: prettier
    uses: moyarich/reusable-workflows/.github/workflows/reusable_heal-cli-dist.yml@main
    with:
      dist-path: packages/workspace-tools/dist/bin/
      build-command: npm run build
      node-version: "24"
      target-branch: ${{ github.ref_name }}
      validation-workflow: ci.yml
    permissions:
      contents: write
      actions: write
