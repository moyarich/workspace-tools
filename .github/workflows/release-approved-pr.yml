name: Release approved preparation PR

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

jobs:
  approved-release:
    name: Verify, release and publish approved packages
    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release/prepare-') }}
    permissions:
      contents: write
      packages: write
    uses: moyarich/reusable-workflows/.github/workflows/reusable_approved-release.yml@feat/approved-release-publish
    with:
      expected-base: main
      dry-run: false
    secrets:
      npm-token: ${{ secrets._NPM_TOKEN }}
